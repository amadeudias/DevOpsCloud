[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# URLs da versão antiga do blog (app React do Replit)
[[redirects]]
  from = "/article/*"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/category/security"
  to = "/categorias/seguranca/"
  status = 301

[[redirects]]
  from = "/category/cloud"
  to = "/categorias/"
  status = 301

[[redirects]]
  from = "/category/:slug"
  to = "/categorias/:slug/"
  status = 301

[[redirects]]
  from = "/about"
  to = "/sobre/"
  status = 301

[[redirects]]
  from = "/admin"
  to = "/"
  status = 301

[[redirects]]
  from = "/api/*"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
